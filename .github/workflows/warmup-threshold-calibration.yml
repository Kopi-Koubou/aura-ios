name: Warmup Threshold Calibration

on:
  schedule:
    - cron: "10 1 * * *"
  workflow_dispatch:
    inputs:
      artifact_limit:
        description: "Maximum warm-cache metrics artifacts to analyze"
        required: false
        default: "20"
        type: string
      threshold_min_runs:
        description: "Minimum runs required before applying threshold updates"
        required: false
        default: "10"
        type: string
      retry_rate_buffer_percent:
        description: "Buffer added on top of p95 retry rate"
        required: false
        default: "5"
        type: string
      min_recommended_retry_rate_percent:
        description: "Lower bound for recommended threshold"
        required: false
        default: "0"
        type: string
      allow_low_confidence:
        description: "Allow recommendations below minimum run confidence"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      fail_on_low_confidence:
        description: "Fail workflow when confidence guard is triggered"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      low_confidence_streak_threshold:
        description: "Consecutive scheduled low-confidence runs required before escalation issue upsert"
        required: false
        default: "3"
        type: string
      low_confidence_history_lookback_runs:
        description: "Number of prior scheduled runs inspected to calculate low-confidence streak"
        required: false
        default: "10"
        type: string
      open_pr:
        description: "Open a PR automatically when drift is detected"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  calibrate-threshold:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: warmup-threshold-calibration
      cancel-in-progress: false

    env:
      GH_TOKEN: ${{ github.token }}
      WARMUP_THRESHOLD_GITHUB_REPOSITORY: ${{ github.repository }}
      WARMUP_THRESHOLD_ARTIFACT_LIMIT: ${{ github.event.inputs.artifact_limit }}
      WARMUP_THRESHOLD_MIN_RUNS: ${{ github.event.inputs.threshold_min_runs }}
      RETRY_RATE_BUFFER_PERCENT: ${{ github.event.inputs.retry_rate_buffer_percent }}
      MIN_RECOMMENDED_RETRY_RATE_PERCENT: ${{ github.event.inputs.min_recommended_retry_rate_percent }}
      WARMUP_THRESHOLD_ALLOW_LOW_CONFIDENCE: ${{ github.event.inputs.allow_low_confidence }}
      WARMUP_THRESHOLD_FAIL_ON_LOW_CONFIDENCE: ${{ github.event.inputs.fail_on_low_confidence }}
      WARMUP_THRESHOLD_LOW_CONFIDENCE_STREAK_THRESHOLD_INPUT: ${{ github.event.inputs.low_confidence_streak_threshold }}
      WARMUP_THRESHOLD_LOW_CONFIDENCE_HISTORY_LOOKBACK_RUNS_INPUT: ${{ github.event.inputs.low_confidence_history_lookback_runs }}
      WARMUP_THRESHOLD_LOW_CONFIDENCE_ESCALATION_OPEN_ISSUES_MAX_PAGES_INPUT: "10"
      WARMUP_THRESHOLD_LOW_CONFIDENCE_ESCALATION_CLOSED_ISSUES_MAX_PAGES_INPUT: "10"
      WARMUP_THRESHOLD_OPEN_PR_INPUT: ${{ github.event.inputs.open_pr }}
      WARMUP_THRESHOLD_APPLY_CHANGES: "true"
      WARMUP_THRESHOLD_OUTPUT_DIR: ./ops/warmup-threshold-calibration

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve defaults
        run: |
          if [ -z "${WARMUP_THRESHOLD_ARTIFACT_LIMIT:-}" ]; then
            WARMUP_THRESHOLD_ARTIFACT_LIMIT="20"
          fi
          if [ -z "${WARMUP_THRESHOLD_MIN_RUNS:-}" ]; then
            WARMUP_THRESHOLD_MIN_RUNS="10"
          fi
          if [ -z "${RETRY_RATE_BUFFER_PERCENT:-}" ]; then
            RETRY_RATE_BUFFER_PERCENT="5"
          fi
          if [ -z "${MIN_RECOMMENDED_RETRY_RATE_PERCENT:-}" ]; then
            MIN_RECOMMENDED_RETRY_RATE_PERCENT="0"
          fi
          if [ -z "${WARMUP_THRESHOLD_ALLOW_LOW_CONFIDENCE:-}" ]; then
            WARMUP_THRESHOLD_ALLOW_LOW_CONFIDENCE="false"
          fi
          if [ -z "${WARMUP_THRESHOLD_FAIL_ON_LOW_CONFIDENCE:-}" ]; then
            WARMUP_THRESHOLD_FAIL_ON_LOW_CONFIDENCE="false"
          fi
          if [ -z "${WARMUP_THRESHOLD_LOW_CONFIDENCE_STREAK_THRESHOLD_INPUT:-}" ]; then
            WARMUP_THRESHOLD_LOW_CONFIDENCE_STREAK_THRESHOLD_INPUT="3"
          fi
          if [ -z "${WARMUP_THRESHOLD_LOW_CONFIDENCE_HISTORY_LOOKBACK_RUNS_INPUT:-}" ]; then
            WARMUP_THRESHOLD_LOW_CONFIDENCE_HISTORY_LOOKBACK_RUNS_INPUT="10"
          fi
          if [ -z "${WARMUP_THRESHOLD_LOW_CONFIDENCE_ESCALATION_OPEN_ISSUES_MAX_PAGES_INPUT:-}" ]; then
            WARMUP_THRESHOLD_LOW_CONFIDENCE_ESCALATION_OPEN_ISSUES_MAX_PAGES_INPUT="10"
          fi
          if [ -z "${WARMUP_THRESHOLD_LOW_CONFIDENCE_ESCALATION_CLOSED_ISSUES_MAX_PAGES_INPUT:-}" ]; then
            WARMUP_THRESHOLD_LOW_CONFIDENCE_ESCALATION_CLOSED_ISSUES_MAX_PAGES_INPUT="10"
          fi
          if [ -z "${WARMUP_THRESHOLD_OPEN_PR_INPUT:-}" ]; then
            WARMUP_THRESHOLD_OPEN_PR_INPUT="true"
          fi

          for integer_value in \
            WARMUP_THRESHOLD_ARTIFACT_LIMIT \
            WARMUP_THRESHOLD_MIN_RUNS \
            RETRY_RATE_BUFFER_PERCENT \
            MIN_RECOMMENDED_RETRY_RATE_PERCENT \
            WARMUP_THRESHOLD_LOW_CONFIDENCE_STREAK_THRESHOLD_INPUT \
            WARMUP_THRESHOLD_LOW_CONFIDENCE_HISTORY_LOOKBACK_RUNS_INPUT \
            WARMUP_THRESHOLD_LOW_CONFIDENCE_ESCALATION_OPEN_ISSUES_MAX_PAGES_INPUT \
            WARMUP_THRESHOLD_LOW_CONFIDENCE_ESCALATION_CLOSED_ISSUES_MAX_PAGES_INPUT; do
            value="${!integer_value}"
            if ! [[ "${value}" =~ ^[0-9]+$ ]]; then
              echo "::error::${integer_value} must be an integer."
              exit 1
            fi
          done

          for bool_value in \
            WARMUP_THRESHOLD_ALLOW_LOW_CONFIDENCE \
            WARMUP_THRESHOLD_FAIL_ON_LOW_CONFIDENCE \
            WARMUP_THRESHOLD_OPEN_PR_INPUT; do
            value="${!bool_value}"
            if [ "${value}" != "true" ] && [ "${value}" != "false" ]; then
              echo "::error::${bool_value} must be true or false."
              exit 1
            fi
          done

          if [ "${RETRY_RATE_BUFFER_PERCENT}" -gt 100 ] || [ "${MIN_RECOMMENDED_RETRY_RATE_PERCENT}" -gt 100 ]; then
            echo "::error::Retry rate percent knobs must be between 0 and 100."
            exit 1
          fi

          echo "WARMUP_THRESHOLD_ARTIFACT_LIMIT=${WARMUP_THRESHOLD_ARTIFACT_LIMIT}" >> "${GITHUB_ENV}"
          echo "WARMUP_THRESHOLD_MIN_RUNS=${WARMUP_THRESHOLD_MIN_RUNS}" >> "${GITHUB_ENV}"
          echo "RETRY_RATE_BUFFER_PERCENT=${RETRY_RATE_BUFFER_PERCENT}" >> "${GITHUB_ENV}"
          echo "MIN_RECOMMENDED_RETRY_RATE_PERCENT=${MIN_RECOMMENDED_RETRY_RATE_PERCENT}" >> "${GITHUB_ENV}"
          echo "WARMUP_THRESHOLD_ALLOW_LOW_CONFIDENCE=${WARMUP_THRESHOLD_ALLOW_LOW_CONFIDENCE}" >> "${GITHUB_ENV}"
          echo "WARMUP_THRESHOLD_FAIL_ON_LOW_CONFIDENCE=${WARMUP_THRESHOLD_FAIL_ON_LOW_CONFIDENCE}" >> "${GITHUB_ENV}"
          echo "WARMUP_THRESHOLD_LOW_CONFIDENCE_STREAK_THRESHOLD=${WARMUP_THRESHOLD_LOW_CONFIDENCE_STREAK_THRESHOLD_INPUT}" >> "${GITHUB_ENV}"
          echo "WARMUP_THRESHOLD_LOW_CONFIDENCE_HISTORY_LOOKBACK_RUNS=${WARMUP_THRESHOLD_LOW_CONFIDENCE_HISTORY_LOOKBACK_RUNS_INPUT}" >> "${GITHUB_ENV}"
          echo "WARMUP_THRESHOLD_LOW_CONFIDENCE_ESCALATION_OPEN_ISSUES_MAX_PAGES=${WARMUP_THRESHOLD_LOW_CONFIDENCE_ESCALATION_OPEN_ISSUES_MAX_PAGES_INPUT}" >> "${GITHUB_ENV}"
          echo "WARMUP_THRESHOLD_LOW_CONFIDENCE_ESCALATION_CLOSED_ISSUES_MAX_PAGES=${WARMUP_THRESHOLD_LOW_CONFIDENCE_ESCALATION_CLOSED_ISSUES_MAX_PAGES_INPUT}" >> "${GITHUB_ENV}"
          echo "WARMUP_THRESHOLD_OPEN_PR=${WARMUP_THRESHOLD_OPEN_PR_INPUT}" >> "${GITHUB_ENV}"

      - name: Calibrate threshold from warm-cache metrics artifacts
        id: calibrate
        run: |
          set -o pipefail
          bash ./scripts/propose-warmup-threshold-update.sh | tee warmup-threshold-calibration.log

      - name: Annotate low-confidence calibration result
        if: always()
        run: |
          low_confidence_guard="${{ steps.calibrate.outputs.low_confidence_guard_triggered }}"
          low_confidence_reason="${{ steps.calibrate.outputs.low_confidence_reason }}"
          fail_on_low_confidence="${WARMUP_THRESHOLD_FAIL_ON_LOW_CONFIDENCE:-false}"

          if [ "${low_confidence_guard}" != "true" ]; then
            exit 0
          fi

          if [ -z "${low_confidence_reason}" ]; then
            low_confidence_reason="Low-confidence recommendation triggered by confidence guard."
          fi

          if [ "${fail_on_low_confidence}" = "true" ]; then
            echo "::error::Warmup threshold calibration low-confidence: ${low_confidence_reason}"
          else
            echo "::warning::Warmup threshold calibration low-confidence: ${low_confidence_reason}"
          fi

      - name: Resolve low-confidence escalation policy
        if: always()
        id: low_confidence_escalation
        env:
          CALIBRATION_ESCALATION_KIND: warmup_threshold
          CALIBRATION_LOW_CONFIDENCE_TRIGGERED: ${{ steps.calibrate.outputs.low_confidence_guard_triggered }}
          CALIBRATION_LOW_CONFIDENCE_REASON: ${{ steps.calibrate.outputs.low_confidence_reason }}
          CALIBRATION_LOW_CONFIDENCE_STREAK_THRESHOLD: ${{ env.WARMUP_THRESHOLD_LOW_CONFIDENCE_STREAK_THRESHOLD }}
          CALIBRATION_LOW_CONFIDENCE_HISTORY_LOOKBACK_RUNS: ${{ env.WARMUP_THRESHOLD_LOW_CONFIDENCE_HISTORY_LOOKBACK_RUNS }}
          CALIBRATION_ESCALATION_EVENT_NAME: ${{ github.event_name }}
          CALIBRATION_ESCALATION_ALLOW_NON_SCHEDULE: "false"
          CALIBRATION_ESCALATION_DRY_RUN: "false"
          CALIBRATION_ESCALATION_GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          bash ./scripts/resolve-calibration-low-confidence-escalation.sh

      - name: Escalate repeated low-confidence streak
        if: ${{ steps.low_confidence_escalation.outputs.escalation_status == 'failure' }}
        id: escalate_low_confidence_failure
        env:
          READINESS_ESCALATION_KIND: ${{ steps.low_confidence_escalation.outputs.escalation_kind }}
          READINESS_ESCALATION_STATUS: failure
          READINESS_LOG_FILE: warmup-threshold-calibration.log
          READINESS_ESCALATION_DRY_RUN: "false"
          READINESS_ESCALATION_OPEN_ISSUES_MAX_PAGES: ${{ env.WARMUP_THRESHOLD_LOW_CONFIDENCE_ESCALATION_OPEN_ISSUES_MAX_PAGES }}
          READINESS_ESCALATION_CLOSED_ISSUES_MAX_PAGES: ${{ env.WARMUP_THRESHOLD_LOW_CONFIDENCE_ESCALATION_CLOSED_ISSUES_MAX_PAGES }}
          CALIBRATION_WORKFLOW_FILE: ${{ steps.low_confidence_escalation.outputs.workflow_file }}
          CALIBRATION_ESCALATION_EVENT_NAME: ${{ github.event_name }}
          CALIBRATION_LOW_CONFIDENCE_STREAK_THRESHOLD: ${{ steps.low_confidence_escalation.outputs.low_confidence_streak_threshold }}
          CALIBRATION_CURRENT_LOW_CONFIDENCE_STREAK: ${{ steps.low_confidence_escalation.outputs.current_low_confidence_streak }}
          CALIBRATION_LOW_CONFIDENCE_REASON: ${{ steps.low_confidence_escalation.outputs.low_confidence_reason }}
          CALIBRATION_FAIL_ON_LOW_CONFIDENCE: ${{ env.WARMUP_THRESHOLD_FAIL_ON_LOW_CONFIDENCE }}
        run: |
          bash ./scripts/run-readiness-escalation.sh

      - name: Resolve low-confidence escalation issue on recovery
        if: ${{ steps.low_confidence_escalation.outputs.escalation_status == 'recovered' }}
        id: escalate_low_confidence_recovery
        env:
          READINESS_ESCALATION_KIND: ${{ steps.low_confidence_escalation.outputs.escalation_kind }}
          READINESS_ESCALATION_STATUS: recovered
          READINESS_LOG_FILE: warmup-threshold-calibration.log
          READINESS_ESCALATION_DRY_RUN: "false"
          READINESS_ESCALATION_OPEN_ISSUES_MAX_PAGES: ${{ env.WARMUP_THRESHOLD_LOW_CONFIDENCE_ESCALATION_OPEN_ISSUES_MAX_PAGES }}
          READINESS_ESCALATION_CLOSED_ISSUES_MAX_PAGES: ${{ env.WARMUP_THRESHOLD_LOW_CONFIDENCE_ESCALATION_CLOSED_ISSUES_MAX_PAGES }}
          CALIBRATION_WORKFLOW_FILE: ${{ steps.low_confidence_escalation.outputs.workflow_file }}
          CALIBRATION_ESCALATION_EVENT_NAME: ${{ github.event_name }}
          CALIBRATION_LOW_CONFIDENCE_STREAK_THRESHOLD: ${{ steps.low_confidence_escalation.outputs.low_confidence_streak_threshold }}
          CALIBRATION_CURRENT_LOW_CONFIDENCE_STREAK: ${{ steps.low_confidence_escalation.outputs.current_low_confidence_streak }}
          CALIBRATION_LOW_CONFIDENCE_REASON: ${{ steps.low_confidence_escalation.outputs.low_confidence_reason }}
          CALIBRATION_FAIL_ON_LOW_CONFIDENCE: ${{ env.WARMUP_THRESHOLD_FAIL_ON_LOW_CONFIDENCE }}
        run: |
          bash ./scripts/run-readiness-escalation.sh

      - name: Upload calibration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warmup-threshold-calibration
          path: |
            warmup-threshold-calibration.log
            ops/warmup-threshold-calibration
          if-no-files-found: ignore

      - name: Open pull request for threshold drift
        id: create_pr
        if: ${{ steps.calibrate.outputs.drift_detected == 'true' && env.WARMUP_THRESHOLD_OPEN_PR == 'true' }}
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ github.token }}
          commit-message: "chore: calibrate warmup retry threshold"
          branch: automation/warmup-threshold-calibration
          delete-branch: true
          title: "chore: calibrate warmup retry threshold"
          body: |
            ## Warmup Threshold Calibration
            - Runs analyzed: `${{ steps.calibrate.outputs.runs_analyzed }}`
            - Metrics files analyzed: `${{ steps.calibrate.outputs.metrics_files_analyzed }}`
            - Retry rate p95: `${{ steps.calibrate.outputs.p95_retry_rate_percent }}%`
            - Recommended max retry rate: `${{ steps.calibrate.outputs.recommended_max_retry_rate_percent }}%`
            - Generated at (UTC): `${{ steps.calibrate.outputs.generated_at_utc }}`

            Generated by `.github/workflows/warmup-threshold-calibration.yml`.
          add-paths: |
            .github/workflows/warm-generated-cache.yml

      - name: Append summary
        if: always()
        run: |
          pr_url="${{ steps.create_pr.outputs.pull-request-url }}"
          low_confidence_reason="${{ steps.calibrate.outputs.low_confidence_reason }}"
          low_confidence_escalation_issue_action="${{ steps.escalate_low_confidence_failure.outputs.issue_action }}"
          low_confidence_escalation_issue_number="${{ steps.escalate_low_confidence_failure.outputs.issue_number }}"
          if [ -z "${pr_url}" ]; then
            pr_url="(none)"
          fi
          if [ -z "${low_confidence_reason}" ]; then
            low_confidence_reason="(none)"
          fi
          if [ -z "${low_confidence_escalation_issue_action}" ]; then
            low_confidence_escalation_issue_action="${{ steps.escalate_low_confidence_recovery.outputs.issue_action }}"
          fi
          if [ -z "${low_confidence_escalation_issue_number}" ]; then
            low_confidence_escalation_issue_number="${{ steps.escalate_low_confidence_recovery.outputs.issue_number }}"
          fi
          if [ -z "${low_confidence_escalation_issue_action}" ]; then
            low_confidence_escalation_issue_action="(none)"
          fi
          if [ -z "${low_confidence_escalation_issue_number}" ]; then
            low_confidence_escalation_issue_number="(none)"
          fi

          {
            echo "## Warmup Threshold Calibration"
            echo "- Artifact limit: \`${WARMUP_THRESHOLD_ARTIFACT_LIMIT}\`"
            echo "- Min runs: \`${WARMUP_THRESHOLD_MIN_RUNS}\`"
            echo "- Retry buffer percent: \`${RETRY_RATE_BUFFER_PERCENT}\`"
            echo "- Minimum recommended retry rate percent: \`${MIN_RECOMMENDED_RETRY_RATE_PERCENT}\`"
            echo "- Allow low confidence: \`${WARMUP_THRESHOLD_ALLOW_LOW_CONFIDENCE}\`"
            echo "- Fail on low confidence: \`${WARMUP_THRESHOLD_FAIL_ON_LOW_CONFIDENCE}\`"
            echo "- Low-confidence streak threshold: \`${WARMUP_THRESHOLD_LOW_CONFIDENCE_STREAK_THRESHOLD}\`"
            echo "- Low-confidence history lookback runs: \`${WARMUP_THRESHOLD_LOW_CONFIDENCE_HISTORY_LOOKBACK_RUNS}\`"
            echo "- Low-confidence escalation open pages max: \`${WARMUP_THRESHOLD_LOW_CONFIDENCE_ESCALATION_OPEN_ISSUES_MAX_PAGES}\`"
            echo "- Low-confidence escalation closed pages max: \`${WARMUP_THRESHOLD_LOW_CONFIDENCE_ESCALATION_CLOSED_ISSUES_MAX_PAGES}\`"
            echo "- Open PR on drift: \`${WARMUP_THRESHOLD_OPEN_PR}\`"
            echo "- Drift detected: \`${{ steps.calibrate.outputs.drift_detected }}\`"
            echo "- Changes applied to workspace: \`${{ steps.calibrate.outputs.changes_applied }}\`"
            echo "- Low-confidence guard triggered: \`${{ steps.calibrate.outputs.low_confidence_guard_triggered }}\`"
            echo "- Low-confidence reason: \`${low_confidence_reason}\`"
            echo "- Low-confidence escalation status: \`${{ steps.low_confidence_escalation.outputs.escalation_status }}\`"
            echo "- Low-confidence previous streak: \`${{ steps.low_confidence_escalation.outputs.previous_low_confidence_streak }}\`"
            echo "- Low-confidence current streak: \`${{ steps.low_confidence_escalation.outputs.current_low_confidence_streak }}\`"
            echo "- Low-confidence escalation issue action: \`${low_confidence_escalation_issue_action}\` (issue: \`${low_confidence_escalation_issue_number}\`)"
            echo "- Runs analyzed: \`${{ steps.calibrate.outputs.runs_analyzed }}\`"
            echo "- Recommended max retry rate: \`${{ steps.calibrate.outputs.recommended_max_retry_rate_percent }}\`"
            echo "- PR URL: \`${pr_url}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
